services:
  backend:
    build: ./backend
    environment:
      ALLOWED_ORIGIN: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      APPS_SCRIPT_URL: ${APPS_SCRIPT_URL:-}
      APPS_SCRIPT_TOKEN: ${APPS_SCRIPT_TOKEN:-}
    volumes:
      - ./dados:/app/dados   
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped