name: Gerar instalador

on:
  push:
    tags: ["v*"]        
  workflow_dispatch:    

permissions:
  contents: write       

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construir o site
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""   
        run: |
          npm ci
          npm run build

      - name: Preparar o Tesseract
        run: |
          $env:Path += ";C:\Program Files\7-Zip"
          python scripts/preparar_tesseract.py

      - name: Empacotar o programa
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller leitor.spec --noconfirm --clean

      - name: Teste de fumaça (liga o programa e confere)
        run: python scripts/smoke_test.py backend/dist/LeitorDeProcessos/LeitorDeProcessos.exe

      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar o instalador
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") { $versao = $env:GITHUB_REF_NAME.TrimStart("v") } else { $versao = "0.0.0-teste" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$versao" installer\leitor.iss

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: installer/Output/*.exe

      - name: Publicar release (só quando há tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arquivo = (Get-ChildItem installer\Output\*.exe | Select-Object -First 1).FullName
          $hash = (Get-FileHash $arquivo -Algorithm SHA256).Hash
          gh release create "$env:GITHUB_REF_NAME" "$arquivo" --title "Leitor de Processos $env:GITHUB_REF_NAME" --notes "SHA-256 do instalador: $hash"